<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintenance Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#193458',
              50:  '#f1f4f9',
              100: '#dde4ee',
              200: '#bac9dc',
              500: '#3d5a83',
              600: '#26456e',
              700: '#193458',
              800: '#132846',
              900: '#0d1c33',
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600; border:1px solid; }
    .badge-op { background:#f0fdf4; color:#15803d; border-color:#86efac; }
    .badge-mt { background:#fffbeb; color:#b45309; border-color:#fcd34d; }
    .badge-bd { background:#fef2f2; color:#b91c1c; border-color:#fca5a5; }
    .badge-neutral { background:#f8fafc; color:#475569; border-color:#cbd5e1; }
    .badge-brand { background:#f1f4f9; color:#193458; border-color:#bac9dc; }
    input[type="checkbox"], input[type="radio"] { accent-color: #193458; }
    .text-center-col { text-align: center; }
    .text-center-col > * { margin-left: auto; margin-right: auto; }
    .list-table { width:100%; border-collapse:separate; border-spacing:0; }
    .list-table thead th { background:#f1f5f9; color:#475569; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; text-align:left; padding:12px 20px; border-bottom:1px solid #e2e8f0; }
    .list-table tbody td { padding:16px 20px; border-bottom:1px solid #e2e8f0; vertical-align:middle; font-size:13px; }
    .list-table tbody tr:last-child td { border-bottom:0; }
    .list-table tbody tr:hover { background:#f8fafc; }
    .cell-primary { font-weight:600; color:#0f172a; }
    .cell-secondary { color:#193458; font-size:12px; margin-top:2px; }
    .cell-muted { color:#64748b; font-size:12px; margin-top:2px; }
    .icon-btn { width:32px; height:32px; display:inline-grid; place-items:center; border-radius:8px; border:1px solid #e2e8f0; color:#475569; background:#fff; }
    .icon-btn:hover { background:#f1f5f9; color:#193458; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand text-white grid place-items-center font-bold">M</div>
        <div>
          <div class="font-semibold leading-tight">Maintenance Mode</div>
          <div class="text-[11px] text-slate-500 leading-tight">Pumps &amp; Blowers</div>
        </div>
      </div>
      <nav id="nav" class="flex gap-1 ml-4 text-sm"></nav>
      <div class="ml-auto flex items-center gap-2">
        <button id="resetBtn" class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1">Reset demo data</button>
      </div>
    </div>
  </header>

  <main id="view" class="max-w-7xl mx-auto px-6 py-6"></main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-20 grid place-items-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center">
        <div id="modalTitle" class="font-semibold"></div>
        <button class="ml-auto text-slate-400 hover:text-slate-700" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
