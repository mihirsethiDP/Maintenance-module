<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintenance Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:600; }
    .badge-op { background:#dcfce7; color:#166534; }
    .badge-mt { background:#fef3c7; color:#92400e; }
    .badge-bd { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white grid place-items-center font-bold">M</div>
        <div>
          <div class="font-semibold leading-tight">Maintenance Mode</div>
          <div class="text-[11px] text-slate-500 leading-tight">Pumps &amp; Blowers</div>
        </div>
      </div>
      <nav id="nav" class="flex gap-1 ml-4 text-sm"></nav>
      <div class="ml-auto flex items-center gap-2">
        <button id="resetBtn" class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1">Reset demo data</button>
      </div>
    </div>
  </header>

  <main id="view" class="max-w-7xl mx-auto px-6 py-6"></main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-20 grid place-items-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center">
        <div id="modalTitle" class="font-semibold"></div>
        <button class="ml-auto text-slate-400 hover:text-slate-700" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
