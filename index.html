  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },

              700: '#193458',
              800: '#132846',
              900: '#0d1c33',
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: linear-gradient(180deg, #eef2f8 0%, #f6f8fb 320px) fixed, #f6f8fb; }
    h1, h2, h3 { letter-spacing: -0.02em; }

    /* --- Design system: surfaces, controls, motion --- */
    body .bg-white.rounded-xl { border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -16px rgba(25,52,88,0.10); }
    button { transition: background-color 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s; }
    button:active:not(:disabled) { transform: translateY(0.5px); }
    button.bg-brand { background-image: linear-gradient(180deg, #24436b, #193458); box-shadow: 0 1px 2.5px rgba(25,52,88,0.35); }
    button.bg-brand:hover { background-image: linear-gradient(180deg, #2b4c78, #1d3a61); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3d5a83 !important; box-shadow: 0 0 0 3px rgba(61,90,131,0.13); }
    #modal { backdrop-filter: blur(3px); }
    @keyframes modalPop { from { transform: scale(0.965) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    #modal > div { border-radius: 16px; box-shadow: 0 24px 64px -12px rgba(15,23,42,0.38); animation: modalPop 0.16s ease-out; }
    @keyframes toastUp { from { transform: translate(-50%, 12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    #appToast { animation: toastUp 0.2s ease-out; box-shadow: 0 10px 28px -8px rgba(25,52,88,0.5); }
    * { scrollbar-width: thin; scrollbar-color: #c3cddd transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: #c3cddd; border-radius: 9999px; }
    *::-webkit-scrollbar-track { background: transparent; }
    /* Header (navy band) variants */
    #headerRight .queue-pill { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); color: #e6ecf5; }
    #headerRight .queue-pill .qp-spin { border-color: rgba(255,255,255,0.35); border-top-color: #fff; }
    .login-card { position: relative; overflow: hidden; }
    .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #193458, #3d5a83 55%, #7fa3d0); }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:9999px; font-size:10.5px; font-weight:600; border:1px solid; white-space:nowrap; line-height:1.5; }
    .badge-op { background:#f0fdf4; color:#15803d; border-color:#86efac; }
    .badge-mt { background:#fffbeb; color:#b45309; border-color:#fcd34d; }
    .badge-bd { background:#fef2f2; color:#b91c1c; border-color:#fca5a5; }
    .badge-neutral { background:#f8fafc; color:#475569; border-color:#cbd5e1; }
    .badge-brand { background:#f1f4f9; color:#193458; border-color:#bac9dc; }
    input[type="checkbox"], input[type="radio"] { accent-color: #193458; }
    .list-table thead th.col-center,
    .list-table tbody td.col-center { text-align: center !important; }
    .list-table tbody td.col-center > * { display: inline-flex; }
    .cell-center { display: flex; justify-content: center; align-items: center; }
    .list-table { width:100%; border-collapse:separate; border-spacing:0; }
    .list-table thead th { background:#f1f5f9; color:#475569; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; text-align:left; padding:12px 20px; border-bottom:1px solid #e2e8f0; }
    .list-table tbody td { padding:16px 20px; border-bottom:1px solid #e2e8f0; vertical-align:middle; font-size:13px; }
    .list-table tbody tr:last-child td { border-bottom:0; }
    .list-table tbody tr:hover { background:#f8fafc; }
    .cell-primary { font-weight:600; color:#0f172a; }
    .cell-secondary { color:#193458; font-size:12px; margin-top:2px; }
    .cell-muted { color:#64748b; font-size:12px; margin-top:2px; }
    .tag-chip { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 10px; border-radius:8px; background:#f1f4f9; color:#193458 !important; font-weight:600; font-size:12.5px; text-decoration:none; border:1px solid #dde4ee; transition:background 0.15s, border-color 0.15s; max-width:230px; }
    .tag-chip .tag-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tag-chip:hover { background:#dde4ee; border-color:#bac9dc; }
    .tag-chip svg { opacity:0.65; flex-shrink:0; }
    .parts-details > summary { list-style: none; }
    .parts-details > summary::-webkit-details-marker { display: none; }
    .parts-details[open] .parts-chevron { transform: rotate(90deg); }
    .parts-chevron { transition: transform 0.15s; }
    .list-table tbody td .cell-primary:has(.tag-chip) { display:block; }
    .list-table tbody td:has(> .cell-primary > .tag-chip) { padding-top:10px; padding-bottom:10px; }
    .recip-picker { position:relative; }
    .picker-wrap { display:flex; flex-wrap:wrap; gap:4px; align-items:center; border:1px solid #cbd5e1; border-radius:6px; padding:4px 6px; background:white; min-height:34px; }
    .picker-wrap:focus-within { border-color:#193458; box-shadow:0 0 0 2px #f1f4f9; }
    .recip-chip { display:inline-flex; align-items:center; gap:4px; background:#f1f4f9; color:#193458; padding:2px 4px 2px 8px; border-radius:9999px; font-size:11px; font-weight:500; border:1px solid #dde4ee; }
    .recip-chip button { color:#475569; font-size:15px; line-height:1; padding:0 4px; border-radius:9999px; }
    .recip-chip button:hover { color:#193458; background:#dde4ee; }
    .picker-input { flex:1; min-width:100px; border:none; outline:none; font-size:12px; padding:3px 4px; background:transparent; }
    .picker-dropdown { position:absolute; left:0; right:0; top:100%; background:white; border:1px solid #cbd5e1; border-radius:6px; box-shadow:0 6px 16px rgba(15,23,42,0.08); margin-top:2px; max-height:200px; overflow-y:auto; z-index:50; }
    .picker-dropdown.hidden { display:none; }
    .picker-dropdown > div { padding:6px 10px; cursor:pointer; font-size:12px; display:flex; flex-direction:column; }
    .picker-dropdown > div:hover { background:#f1f4f9; color:#193458; }
    .picker-dropdown .pd-name { font-weight:500; color:#0f172a; }
    .picker-dropdown > div:hover .pd-name { color:#193458; }
    .picker-dropdown .pd-role { font-size:11px; color:#64748b; }
    .picker-dropdown .pd-empty { color:#94a3b8; cursor:default; font-style:italic; padding:8px 10px; }
    .picker-dropdown .pd-empty:hover { background:transparent; color:#94a3b8; }
    .icon-btn { width:32px; height:32px; display:inline-grid; place-items:center; border-radius:8px; border:1px solid #e2e8f0; color:#475569; background:#fff; }

    /* Notification center */
    @keyframes notifSlideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes notifFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .notif-backdrop { background: rgba(15,23,42,0.28); backdrop-filter: blur(2px); animation: notifFadeIn 0.18s ease; }
    .notif-sheet { animation: notifSlideIn 0.22s cubic-bezier(0.16,1,0.3,1); box-shadow: -12px 0 40px rgba(15,23,42,0.18); }
    .notif-head { background: linear-gradient(135deg, #193458 0%, #26456e 100%); color: #fff; }
    .notif-head .nh-count { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 9999px; }
    .notif-head button.nh-action { font-size: 11px; font-weight: 500; color: #dce5f2; padding: 4px 10px; border: 1px solid rgba(255,255,255,0.28); border-radius: 9999px; transition: all 0.15s; white-space: nowrap; }
    .notif-head button.nh-action:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .notif-seg { display: flex; gap: 2px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px; }
    .notif-seg button { font-size: 11px; font-weight: 500; color: #64748b; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
    .notif-seg button.on { background: #fff; color: #193458; font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
    .notif-group-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 8px 16px 6px; background: rgba(248,250,252,0.92); backdrop-filter: blur(4px); border-bottom: 1px solid #eef2f7; font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #64748b; }
    .notif-group-h .g-dot { width: 7px; height: 7px; border-radius: 9999px; flex-shrink: 0; }
    .notif-group-h .g-count { margin-left: auto; font-weight: 600; color: #94a3b8; letter-spacing: 0; }
    .notif-item { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f1f5f9; transition: background 0.12s; position: relative; }
    .notif-item.clickable { cursor: pointer; }
    .notif-item.clickable:hover { background: #f8fafc; }
    .notif-item .n-icon { width: 30px; height: 30px; border-radius: 9999px; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
    .notif-item .n-icon svg { width: 15px; height: 15px; }
    .notif-item .n-msg { font-size: 12.5px; line-height: 1.45; color: #1e293b; }
    .notif-item .n-meta { font-size: 10.5px; color: #94a3b8; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .notif-item .n-unread { width: 7px; height: 7px; border-radius: 9999px; background: #2563eb; flex-shrink: 0; margin-top: 7px; }
    .notif-item.unseen { background: #f6f9ff; }
    .notif-item.unseen:hover { background: #eef4ff; }
    .notif-item .n-go { color: #cbd5e1; flex-shrink: 0; align-self: center; transition: transform 0.12s, color 0.12s; }
    .notif-item.clickable:hover .n-go { color: #193458; transform: translateX(2px); }
    .notif-empty { padding: 56px 24px; text-align: center; }
    .notif-empty .ne-ring { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 9999px; background: #f1f4f9; display: grid; place-items: center; color: #193458; }

    /* Review queue */
    .queue-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #193458; background: #f1f4f9; border: 1px solid #dde4ee; border-radius: 9999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
    .queue-pill .qp-spin { width: 11px; height: 11px; border-radius: 9999px; border: 2px solid #bac9dc; border-top-color: #193458; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .review-row { border-left: 3px solid transparent; }
    .review-row.st-needs_info { border-left-color: #f59e0b; }
    .review-row.st-ambiguous  { border-left-color: #8b5cf6; }
    .review-row.st-ready      { border-left-color: #16a34a; }
    .review-row.st-failed     { border-left-color: #dc2626; }
    .review-row.st-pending, .review-row.st-running { border-left-color: #bac9dc; }
    .nav-badge { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 5px; margin-left: 6px; border-radius: 9999px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; line-height: 1; }

    /* Guide-me tour */
    .tour-fab { position:fixed; right:24px; bottom:24px; width:52px; height:52px; border-radius:9999px; background:#193458; color:#fff; box-shadow:0 8px 22px rgba(25,52,88,0.35); display:grid; place-items:center; z-index:60; transition:transform 0.15s; cursor:pointer; border:none; }
    .tour-fab:hover { transform:translateY(-2px); background:#132846; }
    .tour-fab svg { width:22px; height:22px; }
    .tour-fab-label { position:fixed; right:88px; bottom:34px; background:#193458; color:#fff; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:500; z-index:60; opacity:0; transform:translateX(8px); transition:all 0.15s; pointer-events:none; }
    .tour-fab:hover + .tour-fab-label { opacity:1; transform:translateX(0); }
    .tour-backdrop { position:fixed; inset:0; z-index:200; pointer-events:auto; }
    .tour-spotlight { position:fixed; border-radius:10px; box-shadow:0 0 0 9999px rgba(15,23,42,0.55); border:2px solid #fff; transition:all 0.35s ease; pointer-events:none; z-index:201; }
    .tour-card { position:fixed; background:#fff; padding:18px 20px; border-radius:14px; box-shadow:0 16px 36px rgba(15,23,42,0.3); max-width:380px; z-index:202; }
    .tour-card .tour-step { font-size:11px; font-weight:600; color:#193458; text-transform:uppercase; letter-spacing:0.06em; }
    .tour-card .tour-title { font-size:16px; font-weight:600; color:#0f172a; margin-top:4px; }
    .tour-card .tour-body { font-size:13px; line-height:1.5; color:#334155; margin-top:8px; }
    .tour-card .tour-controls { display:flex; align-items:center; gap:6px; margin-top:14px; }
    .tour-card .tour-controls .spacer { flex:1; }
    .tour-card button.tour-btn { font-size:12px; font-weight:500; padding:6px 12px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; color:#334155; cursor:pointer; }
    .tour-card button.tour-btn:hover { background:#f1f5f9; }
    .tour-card button.tour-btn-primary { background:#193458; color:#fff; border-color:#193458; }
    .tour-card button.tour-btn-primary:hover { background:#132846; }
    .tour-card button.tour-icon { padding:6px; }
    .tour-card .tour-progress { height:4px; background:#e2e8f0; border-radius:9999px; overflow:hidden; margin-top:12px; }
    .tour-card .tour-progress > div { height:100%; background:#193458; transition:width 0.3s; }
    .tour-chooser { position:fixed; right:24px; bottom:88px; background:#fff; border-radius:14px; box-shadow:0 16px 36px rgba(15,23,42,0.25); padding:16px; z-index:61; min-width:280px; }
    .tour-chooser h4 { font-size:14px; font-weight:600; color:#0f172a; margin-bottom:4px; }
    .tour-chooser .ch-sub { font-size:11px; color:#64748b; margin-bottom:10px; }
    .tour-chooser button.ch-card { display:flex; align-items:center; gap:10px; width:100%; padding:10px; border-radius:8px; border:1px solid #e2e8f0; background:#fff; text-align:left; margin-bottom:6px; cursor:pointer; transition:background 0.1s, border-color 0.1s; }
    .tour-chooser button.ch-card:hover { background:#f1f4f9; border-color:#193458; }
    .tour-chooser .ch-card-title { font-weight:600; color:#193458; font-size:13px; }
    .tour-chooser .ch-card-sub { font-size:11px; color:#64748b; margin-top:2px; }
    .tour-chooser select { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:5px 8px; font-size:12px; margin-bottom:10px; background:#fff; }
    .icon-btn:hover { background:#f1f5f9; color:#193458; }

    /* Nav links must not shrink when the nav scrolls horizontally on mobile */
    #nav a { flex-shrink:0; }
    /* Modals never taller than the viewport */
    #modal > div { max-height:94vh; display:flex; flex-direction:column; }
    #modalBody { overflow-y:auto; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      .list-table { min-width:640px; }               /* tables scroll sideways instead of crushing */
      .list-table thead th { padding:10px 12px; }
      .list-table tbody td { padding:12px 12px; }
      #modal { padding:8px; }
      #modalBody .grid-cols-2 { grid-template-columns:1fr; }  /* stack form fields */
      .tour-fab { right:16px; bottom:16px; width:46px; height:46px; }
      .tour-fab-label { display:none; }
      .tour-card { max-width:calc(100vw - 24px); left:12px !important; right:12px; }
      .tour-chooser { left:12px; right:12px; bottom:74px; min-width:0; }
      .picker-dropdown { max-height:150px; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-brand border-b border-white/10 sticky top-0 z-10 shadow-[0_2px_16px_-6px_rgba(13,28,51,0.5)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2 order-1">
        <img src="logo.png?v=1" alt="DigitalPaani" class="h-9 w-auto rounded-md" />
        <span class="hidden sm:block text-[11px] text-white/60 leading-tight border-l border-white/20 pl-2">Maintenance Ops</span>
      </div>
      <nav id="nav" class="order-3 sm:order-2 w-full sm:w-auto sm:ml-4 flex gap-1 text-sm overflow-x-auto whitespace-nowrap"></nav>
      <div id="headerRight" class="order-2 sm:order-3 ml-auto flex items-center gap-2"></div>
    </div>
  </header>

  <main id="view" class="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
    <!-- Boot skeleton — replaced by the first route() render -->
    <div class="min-h-[60vh] flex flex-col items-center justify-center gap-3 text-slate-400">
      <div class="w-10 h-10 rounded-full border-4 border-slate-200 border-t-[#193458] animate-spin"></div>
      <div class="text-sm">Loading…</div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 z-20 grid place-items-center p-4" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center">
        <div id="modalTitle" class="font-semibold"></div>
        <button class="ml-auto text-slate-400 hover:text-slate-700" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="seed-data.js?v=1"></script>
  <script src="app.js?v=55"></script>
</body>
</html>
